<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd6e7" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Salon Besties" />
    <title>Salon Besties</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff4f8; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      /* Story 018: the title text until PixiJS draws the scene over it (the canvas covers it once drawn). */
      .boot-title { position: absolute; left: 0; right: 0; top: 52%; z-index: -1; margin: 0; transform: translateY(-50%); text-align: center; font: 800 40px system-ui, sans-serif; color: #3b2a33; }
    </style>
  </head>
  <body>
    <div id="app"><p class="boot-title" aria-hidden="true">Salon Besties</p></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
